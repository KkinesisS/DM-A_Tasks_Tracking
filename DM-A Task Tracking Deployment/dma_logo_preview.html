<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dark Purple DM-A Logo Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f1f5f9; font-family: 'Segoe UI', sans-serif; color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; gap: 2rem; }
  .card { padding: 2rem 3rem; border-radius: 16px; width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; gap: 1rem; box-shadow: 0 4px 14px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
  .bg-white { background: #ffffff; }
  .bg-slate { background: #f8fafc; }
  .bg-light-purple { background: #f3e8ff; }
  .bg-dark { background: #0c070e; color: #fff; }
  h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.7; }
  img { height: 80px; width: auto; object-fit: contain; }
</style>
</head>
<body>

<div class="card bg-white">
  <h3>Dark Purple (#3b0764) Logo on White Card</h3>
  <img src="dma_logo_dark_purple_transparent.png" alt="Dark Purple DM-A Logo">
</div>

<div class="card bg-slate">
  <h3>Dark Purple Logo on Light Dashboard Background</h3>
  <img src="dma_logo_dark_purple_transparent.png" alt="Dark Purple DM-A Logo">
</div>

<div class="card bg-light-purple">
  <h3>Dark Purple Logo on Soft Purple Header</h3>
  <img src="dma_logo_dark_purple_transparent.png" alt="Dark Purple DM-A Logo">
</div>

<div class="card bg-dark">
  <h3>Inverted White Logo in Dark Mode</h3>
  <img src="dma_logo_clean_transparent.png" alt="White DM-A Logo">
</div>

</body>
</html>
